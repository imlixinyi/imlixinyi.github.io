<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subject_Artemis // Memory Node</title>
    <style>
        :root {
            /* 定义鼠标坐标变量，用于动态背景追踪 */
            --mouse-x: 50%;
            --mouse-y: 50%;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "Consolas", monospace;
        }

        /* 赛博朋克自定义光标（默认箭头：青色光晕 #00f0ff） */
        body {
            background-color: #0d0204;
            color: #00f0ff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="%2300f0ff" stroke="%23050508" stroke-width="1.5"><polygon points="3,3 21,11 12,13 8,21"/></svg>'), auto;
        }

        /* 跟随鼠标移动的动态深红背景 */
        .cyber-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            /* 径向渐变圆心绑定鼠标位置 --mouse-x, --mouse-y */
            background: radial-gradient(circle at var(--mouse-x) var(--mouse-y), #3d060f 0%, #1a0206 45%, #070102 80%);
            z-index: 1;
            transition: opacity 1s ease;
            pointer-events: none;
        }

        /* 扫描线效果 */
        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
        }

        /* 第一阶段：终端容器（居中） */
        #terminal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 50;
            transition: opacity 0.5s ease;
        }

        .terminal-text {
            max-width: 650px;
            font-size: 1.25rem;
            line-height: 2;
            color: #00f0ff;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.6);
            margin-bottom: 50px;
            text-align: center;
            transition: opacity 0.5s ease;
        }

        /* 原版“数据入侵”按钮样式 */
        .btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .btn-sub-text {
            font-size: 0.6rem;
            color: #ff0055;
            letter-spacing: 2px;
            margin-bottom: 2px;
        }

        .cyber-btn {
            background: transparent;
            color: #ff0055;
            border: 1px solid #ff0055;
            padding: 4px 16px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            position: relative;
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
            transition: all 0.2s;
            /* 自定义悬停手型光标（玫红色 #ff0055 契合按钮主题） */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="%23ff0055" stroke="%23050508" stroke-width="1.5"><path d="M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v0a2 2 0 0 0-2-2 2 2 0 0 0-2 2v0a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7.5L5.4 12.1a2 2 0 0 0-2.8 2.8l5.2 6.1A6 6 0 0 0 12.2 23H15a6 6 0 0 0 6-6v-4a2 2 0 0 0-2-2z"/></svg>') 8 0, pointer;
        }

        .cyber-btn:hover {
            background: #ff0055;
            color: #000;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.8);
        }

        /* 第二阶段：原位继承的赛博入侵进度UI */
        .cyber-progress-wrapper {
            display: flex;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            position: absolute;
        }

        /* 三角警告图标 */
        .alert-icon {
            width: 32px;
            height: 32px;
            fill: none;
            stroke: #ff3333;
            stroke-width: 2;
            filter: drop-shadow(0 0 5px #ff3333);
            transition: transform 0.5s ease;
            flex-shrink: 0;
        }

        .icon-blink {
            animation: iconBlink 0.4s infinite alternate;
        }

        @keyframes iconBlink {
            0% { opacity: 0.2; }
            100% { opacity: 1; }
        }

        /* 展开的进度条面板 */
        .progress-panel {
            display: flex;
            flex-direction: column;
            width: 0px;
            overflow: hidden;
            margin-left: 0px;
            transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1), margin-left 0.6s ease;
            color: #ff3333;
            text-shadow: 0 0 5px rgba(255, 51, 51, 0.7);
        }

        .panel-expanded {
            width: 420px;
            margin-left: 12px;
        }

        .progress-bar-container {
            border: 1px solid #ff3333;
            height: 28px;
            width: 100%;
            position: relative;
            background: rgba(20, 0, 0, 0.6);
            display: flex;
            align-items: center;
            padding: 0 8px;
        }

        .progress-fill {
            position: absolute;
            top: 0; left: 0; height: 100%;
            width: 0%;
            background: rgba(255, 51, 51, 0.8);
            box-shadow: 0 0 10px #ff3333;
            z-index: 1;
        }

        .status-text {
            position: relative;
            z-index: 2;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .protocol-code {
            position: absolute;
            right: 8px;
            font-size: 0.6rem;
            text-align: right;
            z-index: 2;
            line-height: 1.1;
        }

        .progress-sub {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            margin-top: 4px;
        }

        /* 摄像头坏屏效果 */
        .cam-glitch {
            animation: camGlitchAnim 0.08s infinite;
        }

        @keyframes camGlitchAnim {
            0% { filter: hue-rotate(0deg) contrast(200%); transform: translate(2px, 0); }
            20% { filter: hue-rotate(90deg) invert(0.8); transform: translate(-4px, 3px); }
            40% { filter: contrast(300%) grayscale(0.5); transform: translate(5px, -2px); }
            60% { filter: hue-rotate(180deg); transform: translate(-2px, -3px); }
            80% { filter: invert(0.3); transform: translate(3px, 2px); }
            100% { filter: none; transform: translate(0, 0); }
        }

        /* 粗线条干涉纹理 */
        .glitch-lines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, transparent 80%, rgba(0, 240, 255, 0.4) 85%, transparent 90%);
            background-size: 100% 30px;
            z-index: 90;
            pointer-events: none;
            display: none;
        }

        /* 第三阶段：我家背景 */
        #main-content {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=1920') no-repeat center center/cover;
            opacity: 0;
            transition: opacity 1s ease;
            z-index: 2;
        }

        /* 左上角 CCTV 标签 */
        .cctv-tag {
            position: absolute;
            top: 25px; left: 25px;
            color: #ff0055;
            font-size: 0.85rem;
            letter-spacing: 1px;
            z-index: 70;
            text-shadow: 0 0 5px #ff0055;
            transition: opacity 0.5s ease;
        }

        .blink-dot {
            display: inline-block;
            animation: blink 0.8s infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="cyber-bg" id="cyber-bg"></div>
    <div class="scanline"></div>
    <div class="glitch-lines" id="glitch-lines"></div>

    <!-- 左上角 CCTV 监控 -->
    <div class="cctv-tag" id="cctv-tag"><span class="blink-dot">●</span> CCTV_CAM_01 : REC (SUBJECT_LOUNGE)</div>

    <!-- 第一阶段及第二阶段统一中央容器 -->
    <div id="terminal-overlay">
        <div class="terminal-text" id="typewriter"></div>
        
        <!-- 按钮容器 -->
        <div class="btn-container" id="btn-container">
            <span class="btn-sub-text">SIGNAL_LINK // LOG_IN</span>
            <button class="cyber-btn" onclick="startHacking()">[ 数据入侵 ]</button>
        </div>

        <!-- 进度条组件：直接放置于按钮原本所在的位置 -->
        <div class="cyber-progress-wrapper" id="progress-wrapper">
            <svg class="alert-icon" id="alert-icon" viewBox="0 0 24 24">
                <polygon points="12,2 2,22 22,22"/>
                <line x1="12" y1="8" x2="12" y2="14"/>
                <circle cx="12" cy="18" r="1" fill="#ff3333"/>
            </svg>

            <div class="progress-panel" id="progress-panel">
                <div class="progress-bar-container">
                    <div class="progress-fill" id="progress-fill"></div>
                    <div class="status-text" id="status-text">正在入侵...</div>
                    <div class="protocol-code">PROTOCOL<br>6520-A44</div>
                </div>
                <div class="progress-sub" id="progress-sub">
                    <span id="percent-text">正在上传 0%</span>
                    <span>CONNECTION 155.608.887</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 第三阶段：主界面（我家背景） -->
    <div id="main-content"></div>

    <script>
        // 1. 监听鼠标移动，实时更新背景深红聚光灯坐标
        window.addEventListener('mousemove', (e) => {
            const xPercent = (e.clientX / window.innerWidth) * 100;
            const yPercent = (e.clientY / window.innerHeight) * 100;
            
            document.documentElement.style.setProperty('--mouse-x', `${xPercent}%`);
            document.documentElement.style.setProperty('--mouse-y', `${yPercent}%`);
        });

        // 打字机字幕效果
        const text = "你好，流窜 AI...\n我知道你一直在此处注视着我。";
        let index = 0;

        function typeWriter() {
            if (index < text.length) {
                const char = text.charAt(index);
                document.getElementById("typewriter").innerHTML += char === '\n' ? '<br>' : char;
                index++;
                setTimeout(typeWriter, 80);
            } else {
                document.getElementById("btn-container").style.opacity = "1";
            }
        }
        window.onload = typeWriter;

        // 执行数据入侵逻辑
        function startHacking() {
            const btnContainer = document.getElementById("btn-container");
            const terminalText = document.getElementById("typewriter");
            const wrapper = document.getElementById("progress-wrapper");
            const icon = document.getElementById("alert-icon");
            const panel = document.getElementById("progress-panel");
            const fill = document.getElementById("progress-fill");
            const percentText = document.getElementById("percent-text");
            const statusText = document.getElementById("status-text");
            const glitchLines = document.getElementById("glitch-lines");
            const mainContent = document.getElementById("main-content");
            const cyberBg = document.getElementById("cyber-bg");
            const cctvTag = document.getElementById("cctv-tag");

            // 1. 隐藏文字与【数据入侵】按钮，在原位置淡入显示警告图标
            btnContainer.style.opacity = "0";
            terminalText.style.opacity = "0";
            setTimeout(() => {
                btnContainer.style.display = "none";
                terminalText.style.display = "none";
            }, 500);

            wrapper.style.opacity = "1";
            icon.classList.add("icon-blink");

            // 2. 图标闪烁后向左展开进度条
            setTimeout(() => {
                icon.classList.remove("icon-blink");
                panel.classList.add("panel-expanded");

                // 3. 动态上涨进度条
                let progress = 0;
                const timer = setInterval(() => {
                    progress += Math.floor(Math.random() * 5) + 2;
                    if (progress > 100) progress = 100;

                    fill.style.width = progress + "%";
                    percentText.innerText = "正在上传 " + progress + "%";

                    // 4. 进度条 >85% 触发坏屏效果
                    if (progress > 85 && !document.body.classList.contains("cam-glitch")) {
                        document.body.classList.add("cam-glitch");
                        glitchLines.style.display = "block";
                    }

                    // 5. 完成入侵
                    if (progress === 100) {
                        clearInterval(timer);
                        setTimeout(() => finishHack(), 400);
                    }
                }, 80);

            }, 1000);

            function finishHack() {
                // 停止坏屏动效
                document.body.classList.remove("cam-glitch");
                glitchLines.style.display = "none";

                // 切换场景背景
                mainContent.style.opacity = "1";
                cyberBg.style.opacity = "0";
                
                statusText.innerText = "已完成";
                fill.style.display = "none";
                document.getElementById("progress-sub").style.visibility = "hidden";

                // CCTV 闪烁 3 秒后与中央组件一同淡出
                setTimeout(() => {
                    cctvTag.style.opacity = "0";
                    wrapper.style.opacity = "0";
                }, 3000);
            }
        }
    </script>
</body>
</html>
